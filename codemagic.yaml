# CineGuide – build e pubblicazione (Capacitor 7).
# Prerequisiti in Codemagic (una tantum):
#   - app collegata al repo KONECHOCO/programmi-tv
#   - gruppo variabili "google_play"   → GOOGLE_PLAY_SERVICE_ACCOUNT_JSON (già usato dalle altre app)
#   - keystore Android "ithelpdesk_android" e integrazione App Store Connect "Ikonet Solutions" (già esistenti)
# Le build partono solo manualmente (nessun trigger automatico).

definitions:
  scripts:
    - &check_admob
      name: Verifica ID AdMob di produzione
      script: |
        if [ -z "$ADMOB_ANDROID_APP_ID" ] || [ -z "$ADMOB_IOS_APP_ID" ] || [ -z "$VITE_ADMOB_IOS_BANNER_ID" ] || [ -z "$VITE_ADMOB_ANDROID_BANNER_ID" ]; then
          if [ "$ALLOW_TEST_ADS" = "true" ]; then
            echo "ATTENZIONE: build con annunci di TEST (ALLOW_TEST_ADS=true)"
          else
            echo "ERRORE: mancano gli ID AdMob (gruppo cineguide_admob). Imposta ALLOW_TEST_ADS=true solo per build di prova."
            exit 1
          fi
        fi

workflows:
  android-release:
    name: CineGuide — Android (Play Store)
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      android_signing:
        - ithelpdesk_android
      groups:
        - google_play
      vars:
        PACKAGE_NAME: com.ikonet.cineguide
        GOOGLE_PLAY_TRACK: internal
        VITE_APP_VERSION: 1.0.0
        # AdMob (account pub-1151868778464777) – ID pubblici, inclusi comunque nell'app
        ADMOB_ANDROID_APP_ID: ca-app-pub-1151868778464777~4109857664
        ADMOB_IOS_APP_ID: ca-app-pub-1151868778464777~9586554785
        VITE_ADMOB_ANDROID_BANNER_ID: ca-app-pub-1151868778464777/4735795196
        VITE_ADMOB_ANDROID_INTERSTITIAL_ID: ca-app-pub-1151868778464777/1708064768
        VITE_ADMOB_IOS_BANNER_ID: ca-app-pub-1151868778464777/3614285217
        VITE_ADMOB_IOS_INTERSTITIAL_ID: ca-app-pub-1151868778464777/1675266016
      node: 22
      java: 21
    scripts:
      - *check_admob
      - name: Installa dipendenze
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor Android
        script: npx cap sync android
      - name: SDK Android
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Numero di build (ultimo su Google Play + 1)
        script: |
          set +e
          LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" --tracks=internal,alpha,beta,production)
          set -e
          if ! [[ "$LATEST" =~ ^[0-9]+$ ]]; then LATEST=0; fi
          echo "BUILD_NUMBER=$((LATEST + 1))" >> $CM_ENV
      - name: Build AAB firmato
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/mapping/release/mapping.txt
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        track: $GOOGLE_PLAY_TRACK
        submit_as_draft: true

  ios-release:
    name: CineGuide — iOS (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Ikonet Solutions
    environment:
      ios_signing:
        provisioning_profiles:
          - cineguide_appstore
        certificates:
          - ithelpdesk_distribution_20260916
      vars:
        BUNDLE_ID: com.ikonet.cineguide
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        VITE_APP_VERSION: 1.0.0
        # AdMob (account pub-1151868778464777) – ID pubblici, inclusi comunque nell'app
        ADMOB_ANDROID_APP_ID: ca-app-pub-1151868778464777~4109857664
        ADMOB_IOS_APP_ID: ca-app-pub-1151868778464777~9586554785
        VITE_ADMOB_ANDROID_BANNER_ID: ca-app-pub-1151868778464777/4735795196
        VITE_ADMOB_ANDROID_INTERSTITIAL_ID: ca-app-pub-1151868778464777/1708064768
        VITE_ADMOB_IOS_BANNER_ID: ca-app-pub-1151868778464777/3614285217
        VITE_ADMOB_IOS_INTERSTITIAL_ID: ca-app-pub-1151868778464777/1675266016
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - *check_admob
      - name: Installa dipendenze
        script: npm ci
      - name: Build web app e sync iOS
        script: |
          npm run build
          npx cap sync ios
      - name: ID app AdMob nell'Info.plist
        script: |
          if [ -n "$ADMOB_IOS_APP_ID" ]; then
            /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier $ADMOB_IOS_APP_ID" ios/App/App/Info.plist
          fi
      - name: CocoaPods
        script: cd ios/App && pod install
      - name: Profili di firma
        script: xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Numero di build (ultimo TestFlight + 1)
        script: |
          set +e
          LATEST=$(app-store-connect get-latest-build-number --bundle-id "$BUNDLE_ID" 2>/dev/null)
          set -e
          if ! [[ "$LATEST" =~ ^[0-9]+$ ]]; then LATEST=0; fi
          cd ios/App && agvtool new-version -all "$((LATEST + 1))"
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
