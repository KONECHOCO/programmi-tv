# Pubblica su GitHub Pages (https://konechoco.github.io/programmi-tv/, senza dominio personalizzato:
# le app leggono /epg/ da qui; il sito pubblico è cineguide.ikonetsolutions.com, repo KONECHOCO/cineguide-site):
#   /            versione web dell'app (link condivisi)
#   /epg/        guida TV in JSON, rigenerata ogni 6 ore
#   /legal/      privacy, termini, supporto (URL usati negli store)
name: Guida TV + sito

on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build web app
        run: npm run build
      - name: Genera guida TV
        run: npm run epg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # GitHub disattiva i workflow pianificati dopo 60 giorni senza commit: lo riattiviamo a ogni esecuzione.
      - name: Mantieni attivo l'aggiornamento automatico
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/pages.yml/enable
